; Screenshot uploads for scan training.
;
; PHP's defaults (2M upload, 8M post) sit well under a single 1440p or
; ultrawide game capture, which runs 3-6 MB as PNG. Under the limit the file
; never reaches Laravel at all: PHP discards it and the request arrives with an
; empty $_FILES, which surfaces as "the image field is required" rather than
; anything about size.
;
; Keep these above the 20 MB the API validates against — post_max_size covers
; the image plus the form fields around it — so the limit a contributor is told
; about is the limit that actually applies.
upload_max_filesize = 24M
post_max_size = 26M
