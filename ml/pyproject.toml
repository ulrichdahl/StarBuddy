[project]
name = "starbuddy-ml"
version = "0.1.0"
description = "Stage A panel detector for StarBuddy's on-device screen scanner"
# torch/ROCm wheels do not publish for 3.14 yet; 3.12 is the newest supported.
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    # torch/ROCm needs triton-rocm, which lives only on the pytorch index.
    # uv only applies [tool.uv.sources] to direct dependencies, so it has to
    # be named here rather than left to resolve transitively.
    "triton-rocm ; sys_platform == 'linux'",
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "onnx",
    "onnxruntime",
    # torch 2.10's ONNX exporter is dynamo-based and imports onnxscript.
    "onnxscript",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starbuddy_ml"]

[tool.uv.sources]
torch = { index = "rocm" }
torchvision = { index = "rocm" }
# torch/ROCm pulls triton-rocm, which is only published on the same index.
triton-rocm = { index = "rocm" }

[[tool.uv.index]]
name = "rocm"
url = "https://download.pytorch.org/whl/rocm7.0"
explicit = true
