# Local development — auto-loaded by plain `docker compose up`, never by
# production (which runs `docker compose -f docker-compose.yml …`).
#
# Publishes the web port on localhost, turns the reverse-proxy network into a
# private one so nothing external is required, and swaps the built SPA for a
# Vite dev server with hot module reload: Caddy keeps serving on
# http://localhost:${HTTP_PORT} (one origin, so cookies and Discord login
# behave exactly like production) and proxies everything that isn't the API
# to the `frontend` container. Edit files under frontend/ and the browser
# updates in place. `docker compose logs -f frontend` shows Vite's output.
# PHP over the host's backend/ checkout, running as the host user.
#
# Production bakes the code into the image and runs it as www-data (uid 82).
# In dev that means every backend edit needs an image rebuild before the
# container sees it — which is how `artisan migrate` can truthfully report
# nothing pending while new migration files sit on disk. Mounting the checkout
# fixes that, but only if the process can write to it, so the user is set here
# at run time. The image itself is untouched, so what is deployed is exactly
# what is tested.
#
# DEV_UID/DEV_GID come from the ./dev script (bash makes UID readonly, so they
# cannot be named after it); the defaults cover the usual first user.
x-dev-app: &dev-app
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  volumes:
    # storage/ stays a named volume so uploads survive, and because the
    # container writes there constantly.
    - ./backend:/var/www/html
    - app-storage:/var/www/html/storage

services:
  app:
    <<: *dev-app
  queue:
    <<: *dev-app
  scheduler:
    <<: *dev-app
  reverb:
    <<: *dev-app

  # Dev data stays in plain ./data host directories (postgres/, backups/),
  # replacing the named volumes production uses.
  db:
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  backup:
    volumes:
      - ./data/backups:/backups

  web:
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started

  # Vite dev server over the host's frontend/ checkout. node_modules lives in
  # a named volume (the host's copy is built for the host platform, not this
  # container) and is reinstalled whenever package-lock.json changes.
  frontend:
    image: node:26-alpine
    working_dir: /app
    command: >
      sh -c 'h=$$(md5sum package-lock.json | cut -c1-32);
             [ "$$(cat node_modules/.lock-hash 2>/dev/null)" = "$$h" ] || { npm ci && echo "$$h" > node_modules/.lock-hash; };
             exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort'
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    restart: unless-stopped

volumes:
  frontend-node-modules:

networks:
  proxy:
    name: starbuddy_proxy
    external: false
