name: starbuddy

# StarBuddy community instance — this ONE file is production.
#
#   docker compose -f docker-compose.yml up -d --build
#
# No ports are published: the web container joins your reverse proxy's
# external Docker network under the alias starbuddy-web — the network named
# by STARBUDDY_PROXY_NETWORK (default `proxy`; create it once with
# `docker network create proxy`, or point it at your proxy's own network,
# e.g. `coolify`). Point your nginx/SSL proxy at http://starbuddy-web:80 and
# set APP_URL, DISCORD_REDIRECT_URI, SESSION_DOMAIN and SANCTUM_STATEFUL_DOMAINS
# in .env to your public https domain.
#
# Local development runs plain `docker compose up`, which also loads
# docker-compose.override.yml (publishes a port, no external network, and a
# Vite dev server with hot reload in place of the built SPA).
#
# Persistent data lives under ${STARBUDDY_DATA_DIR:-./data} as plain host
# directories (postgres/, backups/) so you control placement and backup.
#
# Every long-running service has a Docker healthcheck, so `docker compose ps`
# (and platforms like Coolify) report healthy/unhealthy per container, and
# the web container only starts once PHP-FPM is accepting connections.
#
# First start:
#   cp .env.example .env   # fill in Discord credentials, APP_KEY, DB password
#   docker compose -f docker-compose.yml up -d --build
#   docker compose -f docker-compose.yml exec app php artisan migrate --seed --force
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-item-catalog
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-blueprints
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-items
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-resource-types
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-locations
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-quality-bands
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-rarity
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-scan-signatures
#   docker compose -f docker-compose.yml run --rm bot node dist/register-commands.js

x-app: &app
  build:
    context: ./backend
    args:
      STARBUDDY_VERSION: ${STARBUDDY_VERSION:-}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - app-storage:/var/www/html/storage

services:
  app:
    <<: *app
    networks:
      default:
        # Unambiguous name for Caddy: the web container is also attached to
        # the operator's proxy network, where a generic "app" may resolve to
        # a foreign container (NPM names its own service "app").
        aliases:
          - starbuddy-app
    healthcheck:
      # PHP-FPM accepting connections on its pool port.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    <<: *app
    command: php artisan queue:work redis --tries=3 --timeout=90
    healthcheck:
      # Exec form on purpose: a `sh -c` wrapper would match its own cmdline.
      test: ["CMD", "pgrep", "-f", "artisan queue:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan schedule:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    networks:
      default:
        aliases:
          - starbuddy-reverb
    healthcheck:
      # Reverb's built-in health endpoint.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Caddy with the SPA bundle, Caddyfile and Laravel's public/ baked in
  # (docker/web/Dockerfile). No bind mounts: platforms like Coolify relocate
  # those and turn files into empty directories.
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases:
          - starbuddy-web
    healthcheck:
      # Laravel's /up through Caddy → FPM: proves the whole request chain.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bot:
    build:
      context: ./bot
      args:
        STARBUDDY_VERSION: ${STARBUDDY_VERSION:-}
    env_file: .env
    restart: unless-stopped
    environment:
      BACKEND_URL: http://web
      BOT_API_TOKEN: ${STARBUDDY_BOT_API_TOKEN}
      HOME_GUILD_ID: ${STARBUDDY_HOME_GUILD_ID}
    healthcheck:
      # 200 once the Discord gateway session is up, 503 before/without it.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${NOTIFY_PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-starbuddy}
      POSTGRES_USER: ${DB_USERNAME:-starbuddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ${STARBUDDY_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-starbuddy} -d ${DB_DATABASE:-starbuddy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nightly logical backups of the database, kept for 14 days.
  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_DATABASE:-starbuddy}
      POSTGRES_USER: ${DB_USERNAME:-starbuddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ${STARBUDDY_DATA_DIR:-./data}/backups:/backups

networks:
  # Your reverse proxy's network (STARBUDDY_PROXY_NETWORK, default "proxy";
  # Coolify's is "coolify"). Local development redefines it as a private
  # network in docker-compose.override.yml.
  proxy:
    name: ${STARBUDDY_PROXY_NETWORK:-proxy}
    external: true

volumes:
  redis-data:
  app-storage:
