name: starbuddy

# StarBuddy community instance — this ONE file is production.
#
#   docker compose -f docker-compose.yml up -d --build
#
# No ports are published: the web container joins your reverse proxy's
# external Docker network under the alias starbuddy-web — the network named
# by STARBUDDY_PROXY_NETWORK (default `proxy`; create it once with
# `docker network create proxy`, or point it at your proxy's own network,
# e.g. `coolify`). Point your nginx/SSL proxy at http://starbuddy-web:80 and
# set APP_URL, DISCORD_REDIRECT_URI, SESSION_DOMAIN and SANCTUM_STATEFUL_DOMAINS
# in .env to your public https domain.
#
# Local development runs plain `docker compose up`, which also loads
# docker-compose.override.yml (publishes a port, no external network).
#
# Persistent data lives under ${STARBUDDY_DATA_DIR:-./data} as plain host
# directories (postgres/, backups/) so you control placement and backup.
#
# First start:
#   cp .env.example .env   # fill in Discord credentials, APP_KEY, DB password
#   docker compose -f docker-compose.yml up -d --build
#   docker compose -f docker-compose.yml exec app php artisan migrate --seed --force
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-blueprints
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-items
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-resource-types
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-locations
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-quality-bands
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-rarity
#   docker compose -f docker-compose.yml exec app php artisan starbuddy:sync-scan-signatures
#   docker compose -f docker-compose.yml run --rm bot node dist/register-commands.js

x-app: &app
  build:
    context: ./backend
    args:
      STARBUDDY_VERSION: ${STARBUDDY_VERSION:-dev}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - app-storage:/var/www/html/storage

services:
  app:
    <<: *app
    networks:
      default:
        # Unambiguous name for Caddy: the web container is also attached to
        # the operator's proxy network, where a generic "app" may resolve to
        # a foreign container (NPM names its own service "app").
        aliases:
          - starbuddy-app

  queue:
    <<: *app
    command: php artisan queue:work redis --tries=3 --timeout=90

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    networks:
      default:
        aliases:
          - starbuddy-reverb

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-dist:/srv/frontend:ro
      # php_fastcgi resolves scripts against Caddy's own filesystem, so it
      # needs a read-only view of the backend's public dir at the same path
      # the FPM container uses.
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    networks:
      default: {}
      proxy:
        aliases:
          - starbuddy-web

  # Builds the SPA and drops the bundle into the volume Caddy serves.
  frontend:
    build: ./frontend
    command: sh -c "rm -rf /out/* && cp -r /dist/. /out/"
    volumes:
      - frontend-dist:/out

  bot:
    build:
      context: ./bot
      args:
        STARBUDDY_VERSION: ${STARBUDDY_VERSION:-dev}
    env_file: .env
    restart: unless-stopped
    environment:
      BACKEND_URL: http://web
      BOT_API_TOKEN: ${STARBUDDY_BOT_API_TOKEN}
      HOME_GUILD_ID: ${STARBUDDY_HOME_GUILD_ID}

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-starbuddy}
      POSTGRES_USER: ${DB_USERNAME:-starbuddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ${STARBUDDY_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-starbuddy} -d ${DB_DATABASE:-starbuddy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # Nightly logical backups of the database, kept for 14 days.
  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_DATABASE:-starbuddy}
      POSTGRES_USER: ${DB_USERNAME:-starbuddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ${STARBUDDY_DATA_DIR:-./data}/backups:/backups

networks:
  # Your reverse proxy's network (STARBUDDY_PROXY_NETWORK, default "proxy";
  # Coolify's is "coolify"). Local development redefines it as a private
  # network in docker-compose.override.yml.
  proxy:
    name: ${STARBUDDY_PROXY_NETWORK:-proxy}
    external: true

volumes:
  redis-data:
  app-storage:
  frontend-dist:
