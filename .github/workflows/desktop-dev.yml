name: Desktop dev build

# Rolling development builds: every change to the client on main rebuilds the
# desktop apps and replaces the assets on the "dev" pre-release, so the README
# can link to a stable download page.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/desktop-dev.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One UTC stamp shared by both platform builds, so the five installers of
  # a run carry the same name.
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
    steps:
      - id: s
        run: echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: stamp
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: |
              client/src-tauri/target/release/bundle/deb/*.deb
              client/src-tauri/target/release/bundle/rpm/*.rpm
              client/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: |
              client/src-tauri/target/release/bundle/nsis/*.exe
              client/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history for the "changes since last release" list

      # Baked into the binary: the client shows these under "What's new".
      - name: Collect changes since the last live release
        shell: bash
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          { echo "# since ${LAST:-start}"; git log --format='%s' ${LAST:+$LAST..}HEAD -- . ':!screenshots'; } > client/src-tauri/changes.txt
          wc -l client/src-tauri/changes.txt

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build
        working-directory: client
        env:
          # Baked into the binary (option_env!) and shown in the client footer.
          STARBUDDY_BUILD: dev-${{ needs.stamp.outputs.stamp }}
        run: |
          npm ci
          npm run tauri build

      # Dev installers are named by build stamp, not by the (unchanged)
      # version: StarBuddy_0.1.6_x64-setup.exe → StarBuddy_dev-20260827-0315_x64-setup.exe
      - name: Stamp bundle names
        shell: bash
        env:
          STAMP: dev-${{ needs.stamp.outputs.stamp }}
        run: |
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          shopt -s nullglob
          for f in client/src-tauri/target/release/bundle/*/*"$VER"*; do
            mv -v "$f" "${f//$VER/$STAMP}"
          done

      # The bundled Ubuntu libwayland conflicts with newer host Mesa/EGL
      # (white window, "Could not create default EGL display"). Strip it so
      # the host's Wayland client libs are used, and repack.
      - name: Repack AppImage without bundled libwayland
        if: runner.os == 'Linux'
        working-directory: client/src-tauri/target/release/bundle/appimage
        run: |
          APPIMAGE=$(ls *.AppImage)
          ./"$APPIMAGE" --appimage-extract >/dev/null
          rm -fv squashfs-root/usr/lib/libwayland-*.so*
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish-dev:
    needs: [stamp, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release notes: the stamp line (the client parses it for its update
      # check) followed by the commits since the last live release.
      - name: Write release notes
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Build \`dev-${{ needs.stamp.outputs.stamp }}\` (UTC) of \`main\` at ${{ github.sha }}."
            echo "Assets are replaced on every client change — this is not a stable release."
            echo
            echo "### Changes since ${LAST:-the beginning}"
            git log --format='- %s' ${LAST:+$LAST..}HEAD -- . ':!screenshots'
          } > dev-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      # The rolling release is *replaced*, not appended to: drop every
      # asset from earlier builds before uploading this one.
      - name: Prune previous dev assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view dev --json assets -q '.assets[].name' 2>/dev/null \
            | while read -r name; do gh release delete-asset dev "$name" -y; done || true

      - name: Update rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development build (rolling)
          prerelease: true
          make_latest: false
          body_path: dev-notes.md
          files: bundles/**
