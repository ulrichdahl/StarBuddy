name: Desktop dev build

# Rolling development builds: every change to the client on main rebuilds the
# desktop apps and replaces the assets on the "dev" pre-release, so the README
# can link to a stable download page.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/desktop-dev.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: |
              client/src-tauri/target/release/bundle/deb/*.deb
              client/src-tauri/target/release/bundle/rpm/*.rpm
              client/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: |
              client/src-tauri/target/release/bundle/nsis/*.exe
              client/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build
        working-directory: client
        run: |
          npm ci
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Update rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development build (rolling)
          prerelease: true
          make_latest: false
          body: |
            Automatic build of the latest `main` (${{ github.sha }}).
            Assets are replaced on every client change — this is not a stable release.
          files: bundles/**
