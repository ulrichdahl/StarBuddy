name: Desktop dev build

# Rolling development builds: every change to the client on develop rebuilds
# the desktop apps and replaces the assets on the "dev" pre-release, so the
# README can link to a stable download page.
#
# develop, not main: a push to main deploys the server to production (Coolify
# watches that branch), so main carries releases only and day-to-day work
# lands here.

on:
  push:
    branches: [develop]
    paths:
      - "client/**"
      - ".github/workflows/desktop-dev.yml"
      - ".github/scripts/update-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One UTC stamp shared by both platform builds, so the five installers of
  # a run carry the same name.
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
    steps:
      - id: s
        run: echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: stamp
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: |
              client/src-tauri/target/release/bundle/deb/*.deb
              client/src-tauri/target/release/bundle/rpm/*.rpm
              client/src-tauri/target/release/bundle/appimage/*.AppImage
              client/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - os: windows-latest
            bundles: |
              client/src-tauri/target/release/bundle/nsis/*.exe
              client/src-tauri/target/release/bundle/nsis/*.exe.sig
              client/src-tauri/target/release/bundle/msi/*.msi
            # Its own name, app ID and MSI upgrade code, so testers can keep
            # the live StarBuddy installed beside it: its own install folder,
            # settings, pairing and single instance (tauri.dev.conf.json).
            config: --config src-tauri/tauri.dev.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history for the "changes since last release" list

      # Baked into the binary: the client shows these under "What's new".
      - name: Collect changes since the last live release
        shell: bash
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          { echo "# since ${LAST:-start}"; git log --format='%s' ${LAST:+$LAST..}HEAD -- . ':!screenshots' | sed -E 's/ *\[(skip|no) ci\]//g'; } > client/src-tauri/changes.txt
          wc -l client/src-tauri/changes.txt

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libpipewire-0.3-dev libclang-dev

      - name: Build
        working-directory: client
        env:
          # Baked into the binary (option_env!) and shown in the client footer.
          STARBUDDY_BUILD: dev-${{ needs.stamp.outputs.stamp }}
          # Signs the installers the in-place updater takes (tauri.conf.json
          # holds the public half). The build fails without it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build -- ${{ matrix.config }}

      # Dev installers are named by build stamp, not by the (unchanged)
      # version: StarBuddy_0.1.6_x64-setup.exe → StarBuddy_dev-20260827-0315_x64-setup.exe
      - name: Stamp bundle names
        shell: bash
        env:
          STAMP: dev-${{ needs.stamp.outputs.stamp }}
        run: |
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          shopt -s nullglob
          for f in client/src-tauri/target/release/bundle/*/*"$VER"*; do
            dir=$(dirname "$f"); name=$(basename "$f")
            # "StarBuddy Dev_…": no spaces in release asset names.
            name=${name// /-}
            mv -v "$f" "$dir/${name//$VER/$STAMP}"
          done

      # The bundled Ubuntu libwayland conflicts with newer host Mesa/EGL
      # (white window, "Could not create default EGL display"), and a bundled
      # libpipewire looks for its modules under Ubuntu's paths, which don't
      # exist on Arch/Fedora. Both talk to a host daemon, so use the host's
      # copies: strip them and repack.
      #
      # A distro new enough to run the game has both; they are what the
      # desktop's own screen sharing already uses.
      - name: Repack AppImage without bundled host libraries
        if: runner.os == 'Linux'
        working-directory: client/src-tauri/target/release/bundle/appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(ls *.AppImage)
          ./"$APPIMAGE" --appimage-extract >/dev/null
          # Extracted 0700; appimagetool (since its 2026-11 builds) refuses an
          # AppDir other users could not read, and so would their systems.
          chmod -R a+rX squashfs-root
          rm -fv squashfs-root/usr/lib/libwayland-*.so* \
            squashfs-root/usr/lib/libpipewire-*.so* squashfs-root/usr/lib/libspa-*.so*
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool
          # The repack changed the file, so the build's signature no longer
          # matches it: sign it again for the in-place updater.
          rm -f "$APPIMAGE.sig"
          (cd "$GITHUB_WORKSPACE/client" && npx tauri signer sign "$OLDPWD/$APPIMAGE")
          test -s "$APPIMAGE.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish-dev:
    needs: [stamp, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release notes: the stamp line (the client parses it for its update
      # check) followed by the commits since the last live release.
      - name: Write release notes
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Build \`dev-${{ needs.stamp.outputs.stamp }}\` (UTC) of \`main\` at ${{ github.sha }}."
            echo "Assets are replaced on every client change — this is not a stable release."
            echo
            echo "### Changes since ${LAST:-the beginning}"
            git log --format='- %s' ${LAST:+$LAST..}HEAD -- . ':!screenshots' | sed -E 's/ *\[(skip|no) ci\]//g'
          } > dev-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # What dev builds' in-place updater reads: releases/download/dev/latest.json.
      # The version carries the stamp (0.1.16-dev.202611201330); dev builds
      # compare stamps, since they share the release's version.
      - name: Write update manifest
        run: |
          VER=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          STAMP="${{ needs.stamp.outputs.stamp }}"
          node .github/scripts/update-manifest.mjs bundles "$VER-dev.${STAMP//-/}" \
            "https://github.com/${{ github.repository }}/releases/download/dev" \
            > bundles/latest.json
          cat bundles/latest.json

      # The rolling release is *replaced*, not appended to: drop every
      # asset from earlier builds before uploading this one.
      - name: Prune previous dev assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view dev --json assets -q '.assets[].name' 2>/dev/null \
            | while read -r name; do gh release delete-asset dev "$name" -y; done || true

      - name: Update rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development build (rolling)
          prerelease: true
          make_latest: false
          body_path: dev-notes.md
          files: bundles/**
