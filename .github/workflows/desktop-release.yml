name: Desktop release

# Tagged releases: push a v* tag (e.g. v0.1.0) to build the desktop apps for
# Windows and Linux and publish them as a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: |
              client/src-tauri/target/release/bundle/deb/*.deb
              client/src-tauri/target/release/bundle/rpm/*.rpm
              client/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: |
              client/src-tauri/target/release/bundle/nsis/*.exe
              client/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build
        working-directory: client
        run: |
          npm ci
          npm run tauri build

      # The bundled Ubuntu libwayland conflicts with newer host Mesa/EGL
      # (white window, "Could not create default EGL display"). Strip it so
      # the host's Wayland client libs are used, and repack.
      - name: Repack AppImage without bundled libwayland
        if: runner.os == 'Linux'
        working-directory: client/src-tauri/target/release/bundle/appimage
        run: |
          APPIMAGE=$(ls *.AppImage)
          ./"$APPIMAGE" --appimage-extract >/dev/null
          rm -fv squashfs-root/usr/lib/libwayland-*.so*
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: StarBuddy ${{ github.ref_name }}
          generate_release_notes: true
          files: bundles/**
