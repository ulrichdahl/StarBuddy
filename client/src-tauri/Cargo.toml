[package]
name = "starbuddy-client"
version = "0.1.12"
description = "StarBuddy desktop client — Star Citizen Game.log watcher and org ledger companion"
authors = ["Ulrich Dahl <ulrich.dahl@gmail.com>"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "starbuddy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
hostname = "0.4"
ocrs = "0.12"
rten = "0.24"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
tauri-plugin-log = "2"

# Screen capture: xcap on Windows; on Linux the client runs through XWayland
# (like the Wine game), so plain X11 covers it without PipeWire/DRM deps.
[target.'cfg(windows)'.dependencies]
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
