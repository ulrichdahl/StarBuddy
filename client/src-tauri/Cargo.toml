[package]
name = "starbuddy-client"
version = "0.1.13"
description = "StarBuddy desktop client — Star Citizen Game.log watcher and org ledger companion"
authors = ["Ulrich Dahl <ulrich.dahl@gmail.com>"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "starbuddy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
hostname = "0.4"
ocrs = "0.12"
rten = "0.24"
# Word boxes from the detector, so a line can be cut where a panel's column
# ends rather than run across the gutter into the next one.
rten-imageproc = "0.24"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
tauri-plugin-log = "2"

# Screen capture is a stream of one window on both platforms, taken from the
# compositor: it is the only way to keep reading a window that is not in front,
# which is every moment after the player clicks an overlay.
[target.'cfg(windows)'.dependencies]
# Windows.Graphics.Capture: the same idea as the portal — one window, streamed
# by the compositor, arriving whether or not it is in front of anything.
windows-capture = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Capturing one window on Wayland. The compositor will not let an ordinary
# program screenshot a window it did not put in front, so the desktop portal
# asks the player which window instead and hands back a PipeWire stream of it —
# the same road every screen-sharing app takes, and the only one that keeps
# working when the game is behind something.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
