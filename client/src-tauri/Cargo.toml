[package]
name = "starbuddy-client"
version = "1.0.2"
description = "StarBuddy desktop client — Star Citizen Game.log watcher and org ledger companion"
authors = ["Ulrich Dahl <ulrich.dahl@gmail.com>"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "starbuddy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Installing an update in place: the AppImage and the Windows installer,
# signed in CI with the key whose public half is in tauri.conf.json.
tauri-plugin-updater = "2"
# The UnitedDanes link token: 32 bytes from the system's CSPRNG.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "7"
# `rustls` is 0.13's name for what 0.12 called `rustls-tls`, and it now brings
# aws-lc-rs rather than ring as the crypto provider. aws-lc-sys ships prebuilt
# NASM objects, so the Windows build still needs nothing but MSVC.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
# The RSI status loop sleeps and is woken; tauri already runs on tokio.
tokio = { version = "1", features = ["time", "sync"] }
hostname = "0.4"
ocrs = "0.13"
rten = "0.26"
# Word boxes from the detector, so a line can be cut where a panel's column
# ends rather than run across the gutter into the next one.
rten-imageproc = "0.26"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
# Told the moment the launcher rewrites build_manifest.id after patching:
# inotify on Linux (Wine's files too), ReadDirectoryChangesW on Windows.
notify = { version = "8", default-features = false }
tauri-plugin-log = "2"

# Screen capture is a stream of one window on both platforms, taken from the
# compositor: it is the only way to keep reading a window that is not in front,
# which is every moment after the player clicks an overlay.
[target.'cfg(windows)'.dependencies]
# Windows.Graphics.Capture: the same idea as the portal — one window, streamed
# by the compositor, arriving whether or not it is in front of anything.
windows-capture = "2"
# Watching the keyboard for hotkeys the system's own hotkey table never
# delivers, and asking whether this process is running as administrator.
# Waiting for one WinRT call to answer. The trait that does the waiting lives
# here rather than in `windows`, which does not re-export it.
windows-future = "0.3"
# Putting a hidden overlay's webview to sleep: the WebView2 interfaces behind
# the controller tauri hands out. Same version as wry's, so it builds once.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Graphics_Capture",
    "Security_Authorization_AppCapabilityAccess",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Capturing one window on Wayland. The compositor will not let an ordinary
# program screenshot a window it did not put in front, so the desktop portal
# asks the player which window instead and hands back a PipeWire stream of it —
# the same road every screen-sharing app takes, and the only one that keeps
# working when the game is behind something.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "global_shortcuts"] }
# Reading the portal's stream of shortcut presses.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pipewire = "0.10"
# Reaching the WebKitGTK settings of an overlay's webview, to switch off what
# it never uses. Same version and features as wry's, so it builds once.
webkit2gtk = { version = "2.0", features = ["v2_38"] }

# The OCR crates are unusable unoptimised: one refinery panel takes two and a
# half minutes in a debug build against two seconds in a release one, which
# reads as a hung client rather than a slow one. Dependencies are optimised
# even in dev; the client's own code is not, so it can still be stepped
# through.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# No `panic = "abort"`: the analysis service's panic guard and the poisoned-lock recovery rely on unwinding.
